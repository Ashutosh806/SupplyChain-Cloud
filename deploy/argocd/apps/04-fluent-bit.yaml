# Log shipper: DaemonSet tails every container's stdout and pushes to Loki with k8s labels.
# It also consumes the Flink job's logs that Fluent Bit on the EMR nodes publishes to the Kafka
# topic "emr-logs" (EMR -> MSK -> here -> Loki, job="emr-flink"), so the analytics job's logs are
# centralized too without a load balancer. KAFKA_BOOTSTRAP comes from a ConfigMap made by Terraform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.3
    helm:
      valuesObject:
        envFrom:
          - configMapRef:
              name: kafka-endpoints
        daemonSetVolumes:
          - name: varlog
            hostPath: { path: /var/log }
        daemonSetVolumeMounts:
          - name: varlog
            mountPath: /var/log
            readOnly: true
        config:
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                multiline.parser docker, cri
                Tag kube.*
                Mem_Buf_Limit 10MB
                Skip_Long_Lines On
                Refresh_Interval 5

            [INPUT]
                Name kafka
                Tag emr.flink
                Brokers ${KAFKA_BOOTSTRAP}
                Topics emr-logs
                Group_Id fluent-bit-emr-logs
                Format json
                rdkafka.auto.offset.reset earliest
                rdkafka.allow.auto.create.topics true
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off
                Labels On
                Annotations Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On

            [FILTER]
                Name nest
                Match emr.*
                Operation lift
                Nested_under payload
          outputs: |
            [OUTPUT]
                Name loki
                Match kube.*
                Host loki-gateway.monitoring.svc.cluster.local
                Port 80
                labels job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], app=$kubernetes['labels']['app.kubernetes.io/name']
                remove_keys kubernetes
                line_format json
                auto_kubernetes_labels off

            [OUTPUT]
                Name loki
                Match emr.*
                Host loki-gateway.monitoring.svc.cluster.local
                Port 80
                labels job=emr-flink, app=shipment-analytics, namespace=emr, emr_role=$emr_role
                remove_keys topic, partition, offset, error, key
                line_format json
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
