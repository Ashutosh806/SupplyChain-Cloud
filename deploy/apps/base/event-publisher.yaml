# Event Publisher - transactional-outbox relay to Amazon MSK (SKIP LOCKED makes replicas safe).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-publisher
  labels: { app.kubernetes.io/name: event-publisher, app.kubernetes.io/part-of: supplychain }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: event-publisher }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: event-publisher, app.kubernetes.io/part-of: supplychain }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      nodeSelector: { kubernetes.io/arch: amd64 }   # images are built for linux/amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: event-publisher } }
      containers:
        - name: app
          image: event-publisher
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: infra-config }
            - secretRef: { name: db-credentials }
          env:
            - { name: SERVICE_NAME, value: event-publisher }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: OUTBOX_TABLES, value: "supplier.outbox,booking.outbox,inventory.outbox,ingestion.outbox" }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
---
apiVersion: v1
kind: Service
metadata:
  name: event-publisher
  labels: { app.kubernetes.io/name: event-publisher, app.kubernetes.io/part-of: supplychain }
spec:
  selector: { app.kubernetes.io/name: event-publisher }
  ports:
    - { name: http, port: 8080, targetPort: http }
