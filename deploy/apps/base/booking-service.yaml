# Shipment Booking Service - REST API + web UI; calls Supplier (REST) and Inventory (gRPC). Scaled by HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels: { app.kubernetes.io/name: booking-service, app.kubernetes.io/part-of: supplychain }
spec:
  # replicas are owned by the HorizontalPodAutoscaler (hpa.yaml)
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: booking-service }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: booking-service, app.kubernetes.io/part-of: supplychain }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      nodeSelector: { kubernetes.io/arch: amd64 }   # images are built for linux/amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: booking-service } }
      containers:
        - name: app
          image: booking-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: infra-config }
            - secretRef: { name: db-credentials }
          env:
            - { name: SERVICE_NAME, value: booking-service }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: INVENTORY_GRPC, value: "dns:///inventory-service-grpc.supplychain.svc.cluster.local:50051" }  # client-side LB over headless svc
            - { name: SUPPLIER_URL, value: "http://supplier-service:8080" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }   # realistic: lets EKS add nodes when HPAs scale out
            limits: { cpu: 500m, memory: 512Mi }     # one busy pod cannot starve its neighbours
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  labels: { app.kubernetes.io/name: booking-service, app.kubernetes.io/part-of: supplychain }
spec:
  selector: { app.kubernetes.io/name: booking-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
