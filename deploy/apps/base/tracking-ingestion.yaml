# Tracking Ingestion Service - carrier webhooks; dedup; outbox; raw archive to S3. Main HPA target.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-ingestion
  labels: { app.kubernetes.io/name: tracking-ingestion, app.kubernetes.io/part-of: supplychain }
spec:
  # replicas are owned by the HorizontalPodAutoscaler (hpa.yaml)
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: tracking-ingestion }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tracking-ingestion, app.kubernetes.io/part-of: supplychain }
    spec:
      serviceAccountName: tracking-ingestion
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      nodeSelector: { kubernetes.io/arch: amd64 }   # images are built for linux/amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: tracking-ingestion } }
      containers:
        - name: app
          image: tracking-ingestion
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: infra-config }
            - secretRef: { name: db-credentials }
          env:
            - { name: SERVICE_NAME, value: tracking-ingestion }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: BOOKING_URL, value: "http://booking-service:8080" }
            - { name: VALIDATE_TRACKING_IDS, value: "true" }
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-ingestion
  labels: { app.kubernetes.io/name: tracking-ingestion, app.kubernetes.io/part-of: supplychain }
spec:
  selector: { app.kubernetes.io/name: tracking-ingestion }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracking-ingestion   # bound to an IAM role through EKS Pod Identity (Terraform)
