# Environment overlay tracked by Argo CD. `scripts/up.sh images` bumps newTag;
# the commit is the deployment - Argo CD notices it and rolls the change out.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: supplychain
resources:
  - ../../base
images:
  - name: supplier-service
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/supplier-service
    newTag: latest
  - name: booking-service
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/booking-service
    newTag: latest
  - name: inventory-service
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/inventory-service
    newTag: latest
  - name: tracking-ingestion
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/tracking-ingestion
    newTag: latest
  - name: event-publisher
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/event-publisher
    newTag: latest
  - name: delivery-status
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/delivery-status
    newTag: latest
  - name: analytics-api
    newName: 112889061290.dkr.ecr.ap-south-1.amazonaws.com/supplychain/analytics-api
    newTag: latest
