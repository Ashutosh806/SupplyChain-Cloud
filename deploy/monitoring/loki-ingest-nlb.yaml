# Internal NLB in front of Loki so Fluent Bit on the EMR (Flink) nodes can push the
# analytics job's logs into the same centralized store as the EKS services.
apiVersion: v1
kind: Service
metadata:
  name: loki-ingest
  namespace: monitoring
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  loadBalancerSourceRanges:   # only the VPC (EMR nodes) may push logs
    - 10.42.0.0/16
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
