apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-ingress.yaml
  - alert-rules.yaml
configMapGenerator:
  - name: supplychain-dashboard
    files:
      - dashboards/supplychain-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
