# Runs on every push / PR: the whole system locally + all four member checks, and the Flink tests.
name: ci
on: [push, pull_request]
jobs:
  demo-scripts:
    runs-on: ubuntu-latest          # has PostgreSQL installed, which local/run_local.py uses
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]   # 3.12 = container images, 3.14 = newest Ubuntu/WSL
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -r services/requirements.txt
      - run: make test
  flink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B -q package        # compiles, runs the tests and builds the jar that goes to EMR
        working-directory: analytics/flink-job
