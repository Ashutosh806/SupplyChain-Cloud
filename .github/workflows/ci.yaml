# Runs on every push / PR: the whole system locally + all four member checks, and the Flink tests.
name: ci
on: [push, pull_request]
jobs:
  demo-scripts:
    runs-on: ubuntu-latest          # has PostgreSQL installed, which local/run_local.py uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r services/requirements.txt
      - run: make test
  flink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -B -q test
        working-directory: analytics/flink-job
